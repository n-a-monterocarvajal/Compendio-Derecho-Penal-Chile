name: Generar compendio penal

on:
  workflow_dispatch:
    inputs:
      notas_actualizacion:
        description: Motivo y normas actualizadas
        required: false
        default: Ejecución manual del compendio.

permissions:
  contents: write

concurrency:
  group: generar-compendio-penal
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Instalar Chromium de Playwright
        run: python -m playwright install --with-deps chromium

      - name: Generar compendio
        run: generar-compendio-leychile --config app/fuentes.json

      - name: Crear versión publicada
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS_ACTUALIZACION: ${{ inputs.notas_actualizacion }}
        run: |
          archivo=$(find . -maxdepth 1 -name 'CompendioDerechoPenalChile_*.pdf' -print -quit)
          test -n "$archivo"
          nombre_archivo=$(basename "$archivo" .pdf)
          fecha=${nombre_archivo#CompendioDerechoPenalChile_}
          if [[ "$fecha" == "$nombre_archivo" || ! "$fecha" =~ ^[0-9]{8}_[0-9]{4}_UTC$ ]]; then
            echo "Nombre de PDF inesperado: $nombre_archivo" >&2
            exit 1
          fi
          {
            echo "Compendio generado automáticamente desde las fuentes oficiales de Ley Chile."
            echo
            printf '%s\n' "${NOTAS_ACTUALIZACION:-Ejecución manual del compendio.}"
          } > release-notes.md
          gh release create "v${fecha}" "$archivo" \
            --title "Compendio ${fecha}" \
            --notes-file release-notes.md

      - name: Mostrar log si existe
        if: always()
        run: |
          if [ -f trabajo/ultimo_log.txt ]; then
            echo "----- trabajo/ultimo_log.txt -----"
            cat trabajo/ultimo_log.txt
          fi

      - name: Subir PDF generado
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: CompendioDerechoPenalChile
          path: CompendioDerechoPenalChile_*.pdf
          retention-days: 30
          if-no-files-found: error

      - name: Subir diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostico_compendio_penal
          path: |
            trabajo/ultimo_log.txt
            trabajo/descargas/debug_*.png
            trabajo/descargas/debug_*.html
          retention-days: 30
          if-no-files-found: ignore
